import org.gradle.plugins.signing.Sign

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

group = 'kr.higu'
version = '0.1.1'

def signingKey = findProperty('signingKey') ?: System.getenv('ORG_GRADLE_PROJECT_signingKey')
def signingPassword = findProperty('signingPassword') ?: System.getenv('ORG_GRADLE_PROJECT_signingPassword')
def mavenCentralUsername = findProperty('mavenCentralUsername') ?: System.getenv('ORG_GRADLE_PROJECT_mavenCentralUsername')
def mavenCentralPassword = findProperty('mavenCentralPassword') ?: System.getenv('ORG_GRADLE_PROJECT_mavenCentralPassword')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'

    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = group
            artifactId = 'k-oauth'
            version = version

            pom {
                name = 'K-OAuth'
                description = 'A Java OAuth 2.0 library for Korean OAuth providers.'
                url = 'https://github.com/higukang/k-oauth'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'higukang'
                        name = 'higu'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/higukang/k-oauth.git'
                    developerConnection = 'scm:git:ssh://git@github.com/higukang/k-oauth.git'
                    url = 'https://github.com/higukang/k-oauth'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'sonatypeCentral'
            url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')

            credentials {
                username = mavenCentralUsername
                password = mavenCentralPassword
            }
        }
    }
}

signing {
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

tasks.withType(Sign).configureEach {
    onlyIf { signingKey && signingPassword }
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

test {
    useJUnitPlatform()
}
